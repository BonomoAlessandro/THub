<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- THub (Ticket 29): zwei gestapelte Terminals auf einer Graphit-Kachel. Vorlage für 32 px und grösser. -->
  <defs>
    <linearGradient id="kachel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44444d"/>
      <stop offset="1" stop-color="#17171b"/>
    </linearGradient>
    <!-- Lücke um das vordere Terminal: Dort ist das hintere ausgespart, die Kachel scheint durch. -->
    <mask id="luecke">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="40" y="80" width="156" height="132" rx="26" fill="#000"/>
    </mask>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#kachel)"/>
  <rect x="17.5" y="17.5" width="221" height="221" rx="50.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
  <rect x="84" y="56" width="120" height="96" rx="16" fill="#f4f4f5" fill-opacity="0.42" mask="url(#luecke)"/>
  <rect x="52" y="92" width="132" height="108" rx="16" fill="#f4f4f5"/>
  <path d="M80 130l24 20-24 20" fill="none" stroke="#1c1c21" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="162" width="36" height="12" rx="4" fill="#1c1c21"/>
</svg>
